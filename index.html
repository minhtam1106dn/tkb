<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f8fc">
<link rel="icon" type="image/jpeg" href="./images.jpeg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="TKB Khôi">
<title>Thời khóa biểu · Nguyễn Thanh Khôi</title>
<style>
:root{color-scheme:light;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f6f8fc;--paper:#fff;--text:#17243b;--muted:#53627a;--line:#dde4ee;--blue:#2455b5;--blue-bg:#edf3ff;--purple:#7140a1;--purple-bg:#f5effc;--radius:18px;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}body{margin:0;line-height:1.5}button{font:inherit;cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px 16px;background:var(--paper);color:var(--text);font-weight:600;transition:background .18s,border-color .18s}button:hover{background:var(--blue-bg);border-color:var(--blue)}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:active{background:var(--line)}button[aria-pressed=true]{background:var(--text);color:white;border-color:var(--text)}.wrap{width:min(1500px,100%);margin:auto;padding:24px 16px 32px}.topline{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--blue);border-radius:9px;color:#fff}.mark svg{width:20px;height:20px}header{padding:12px 0 26px}.heading{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:clamp(30px,4vw,46px);line-height:1.2;letter-spacing:-.04em;margin:18px 0 10px}h1 span{display:block;font-size:16px;letter-spacing:0;font-weight:500;color:var(--muted);margin-bottom:9px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:22px;letter-spacing:-.025em;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{font-size:14px}.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:8px 0 0}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}.dot.extra{background:var(--purple)}.week{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-width:0}.day.today{border:2px solid var(--blue)}.day-head{padding:15px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fafbfd}.today .day-head{background:var(--blue-bg)}.day-head h3{margin:0;font-size:18px}.today-badge{font-size:11px;font-weight:700;color:var(--blue);background:var(--paper);border-radius:6px;padding:4px 7px}.group{padding:14px 12px 0}.group:last-child{padding-bottom:14px}.group-title{margin:0 0 9px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}.extra-group .group-title{color:var(--purple)}.periods,.lessons{list-style:none;margin:0;padding:0}.periods li{display:flex;gap:9px;padding:8px 3px;border-bottom:1px solid #eef1f6;align-items:baseline}.periods li:last-child{border:0}.period-number{font-size:12px;color:var(--muted);width:16px;flex-shrink:0;font-variant-numeric:tabular-nums}.subject{font-size:14px;font-weight:650;overflow-wrap:anywhere}.teacher{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}.lessons li{border-radius:10px;background:var(--purple-bg);border-left:3px solid var(--purple);padding:10px;margin-top:8px}.lessons time{display:block;color:var(--purple);font-weight:650;font-size:12px;font-variant-numeric:tabular-nums;margin-bottom:3px}.empty{color:var(--muted);font-size:13px;margin:0;padding:10px 0}footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}.skip{position:absolute;left:16px;top:-100px;background:white;padding:12px;z-index:5}.skip:focus{top:10px}
@media(min-width:500px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:850px){.wrap{padding:32px}.week{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1280px){.week{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{@page{size:A4 landscape;margin:9mm}:root{--bg:white}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}.wrap{width:100%;padding:0}.filters,.skip,footer{display:none}header{padding:0 0 12px}h1{font-size:26px;margin:8px 0}.topline{font-size:10px}.mark{display:none}.toolbar{margin-bottom:10px}h2{font-size:16px}.week{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.day{break-inside:avoid;border-radius:8px}.day-head{padding:8px}.day-head h3{font-size:13px}.group{padding:8px 6px 0}.group-title{font-size:9px}.subject{font-size:11px}.teacher,.period-number,.lessons time{font-size:9px}.periods li{padding:5px 0;gap:3px}.lessons li{padding:6px}.today-badge{display:none}}
</style>
</head>
<body>
<a class="skip" href="#schedule">Đến lịch học</a>
<main class="wrap">
<header>
<div class="topline"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h3m2 0h3"/></svg></span> Góc học tập</div>
<div class="heading"><div><h1><span>Thời khóa biểu của</span>Nguyễn Thanh Khôi</h1></div></div>
</header>
<section id="schedule" aria-labelledby="schedule-title">
<div class="toolbar"><div><h2>Lịch học trong tuần</h2><div class="legend"><span><i class="dot" aria-hidden="true"></i>Ở trường</span><span><i class="dot extra" aria-hidden="true"></i>Học thêm</span></div></div><div class="filters" role="group" aria-label="Lọc lịch học"><button data-filter="all" aria-pressed="true">Tất cả</button><button data-filter="school" aria-pressed="false">Ở trường</button><button data-filter="extra" aria-pressed="false">Học thêm</button></div></div>
<div id="week" class="week"></div>
<noscript><p>Vui lòng bật JavaScript để xem thời khóa biểu.</p></noscript>
</section>
<footer><span>Nguyễn Thanh Khôi · Lớp 6.7</span><span>Một tuần học tập thật tốt!</span></footer>
</main>
<script>
const days = [
 {name:'Thứ 2', school:[['Chào cờ','Luận'],['Ngữ văn','Vân (Văn)'],['GD địa phương','Nga'],['Lịch sử','Ái Nữ'],['KHTN','Uyên (H)']], extra:[['17:00','18:00','Piano'],['19:00','20:30','E6 (SM)']]},
 {name:'Thứ 3', school:[['Ngữ văn','Vân (Văn)'],['Ngữ văn','Vân (Văn)'],['Ngoại ngữ','Yến (AV)'],['KHTN','Uyên (H)'],['Toán','Luận']], extra:[['17:30','19:00','KET (SM)'],['19:30','21:00','Toán']]},
 {name:'Thứ 4', school:[['HĐTNHN (CĐ)','Trang'],['Toán','Luận'],['GDCD','Anh (Bùi)'],['Tin học','Duyên'],['KHTN','Uyên (H)']], extra:[['17:30','19:00','Văn']]},
 {name:'Thứ 5', school:[['Ngoại ngữ','Yến (AV)'],['Ngoại ngữ','Yến (AV)'],['KHTN','Uyên (H)'],['Công nghệ','Vy'],['Địa lí','Én']], extra:[['17:30','19:00','KET (SM)']]},
 {name:'Thứ 6', school:[['Địa lí','Én'],['Ngữ văn','Vân (Văn)'],['Toán','Luận'],['Toán','Luận'],['Sinh hoạt lớp','Luận']], second:[null,['Mỹ thuật','Thiên'],['Âm nhạc','Xạ'],['GDTC','C.Đạt'],['GDTC','C.Đạt']], extra:[]},
 {name:'Thứ 7', school:[['HĐTN','Luận'],['HĐTN','Phong']], extra:[['07:00','08:30','Văn'],['09:00','10:00','Piano'],['13:30','15:00','Toán'],['15:30','17:00','E6 (SM)']]}
];
// Morning/afternoon confirmed by parent; school bell times were not provided.
const currentDay = Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Ho_Chi_Minh',weekday:'short'}).format(new Date()).replace(/Sun|Mon|Tue|Wed|Thu|Fri|Sat/g, d=>({Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[d])));
function periods(items){return '<ol class="periods">'+items.map((item,i)=>item?`<li value="${i+1}"><span class="period-number" aria-label="Tiết ${i+1}">${i+1}</span><div class="subject">${item[0]}<span class="teacher">${item[1]}</span></div></li>`:'').join('')+'</ol>';}
function render(filter='all'){
 document.getElementById('week').innerHTML=days.map((day,i)=>`<article class="day ${currentDay===i+1?'today':''}" aria-labelledby="day-${i}">
 <div class="day-head"><h3 id="day-${i}">${day.name}</h3>${currentDay===i+1?'<span class="today-badge">Hôm nay</span>':''}</div>
 ${filter!=='extra'?`<section class="group"><h4 class="group-title">Ở trường · Sáng</h4>${periods(day.school)}</section>${day.second?`<section class="group"><h4 class="group-title">Ở trường · Chiều</h4>${periods(day.second)}</section>`:''}`:''}
 ${filter!=='school'?`<section class="group extra-group"><h4 class="group-title">Học thêm</h4>${day.extra.length?'<ul class="lessons">'+day.extra.map(lesson=>`<li><time>${lesson[0]} – ${lesson[1]}</time><div class="subject">${lesson[2]}</div></li>`).join('')+'</ul>':'<p class="empty">Không có lịch học thêm</p>'}</section>`:''}</article>`).join('');
}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));render(button.dataset.filter);}));
render();
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
  navigator.serviceWorker.register('./sw.js', {scope: './', updateViaCache: 'none'})
   .catch(error => console.error('Không thể bật chế độ ngoại tuyến:', error));
 });
}
</script>
</body>
</html>
